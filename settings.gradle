pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForged'
                    url = uri('https://maven.neoforged.net/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('net.neoforged')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'StrangeQuark-Mods'

// Active mods in the monorepo
def enabledMods = ['analog-redstone-lamp', 'revert-zombie-reinforcement', 'variable-copper-bulb-signal']

// Register each mod and its platform subprojects
def loaders = ['common', 'fabric', 'neoforge']

enabledMods.each { String modName ->
    include ":${modName}"
    project(":${modName}").projectDir = file("mods/${modName}")

    loaders.each { String loader ->
        def subPath = ":${modName}:${loader}"
        include subPath
        project(subPath).projectDir = file("mods/${modName}/${loader}")
    }
}
