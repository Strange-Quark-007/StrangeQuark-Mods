# Project Defaults (can be overridden per-mod in mods/<mod>/gradle.properties)
group=dev.strangequark
version=1.0.0
mod_author=Strange Quark
license=MIT
java_version=25

# Minecraft & Upstream Coordinates (Branch-Specific)
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
pack_format_min=[97, 1]
pack_format_max=97

# NeoForm (used by Common to compile against vanilla MC)
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric Platform
# https://fabricmc.net/develop/
fabric_version=0.160.6+26.3
fabric_loader_version=0.20.1

# NeoForge Platform
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.3-beta
neoforge_loader_version_range=[4,)

# Gradle Plugins
# Loom: https://fabricmc.net/develop/
# ModDevGradle: https://projects.neoforged.net/neoforged/moddevgradle
# Mod Publish: https://github.com/modmuss50/mod-publish-plugin
fabric_loom_version=1.18.1
moddev_gradle_version=2.0.147
mod_publish_version=2.2.1

# Shared ModDevGradle artifact store (root-relative or absolute).
# All mods hardlink identical Minecraft jars into this one directory.
# Must be on the same filesystem/volume as the mod build directories.
moddev_artifact_store=.gradle/moddev-artifacts

# Bump when MDG changes artifact contents without changing its version.
moddev_cache_schema=1

# Gradle Daemon & Memory
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
