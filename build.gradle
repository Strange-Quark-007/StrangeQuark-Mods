plugins {
    id 'base' // Provides standard 'build', 'clean', and 'assemble' lifecycle tasks at root
    id 'net.fabricmc.fabric-loom' version '1.18.1' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1' apply false
}

apply from: "${rootDir}/gradle/generator.gradle"

subprojects { Project sub ->
    if (sub.name in ['common', 'fabric', 'neoforge']) {
        apply from: "${rootDir}/gradle/platform.gradle"
    }
    if (sub.name in ['fabric', 'neoforge']) {
        apply from: "${rootDir}/gradle/publishing.gradle"
    }
    if (sub.parent == rootProject && sub.name != 'common') {
        // Container mod projects (e.g. :mod-a, :mod-b)
        sub.tasks.register('publishMods') {
            group = 'publishing'
            description = "Publishes all built platform jars (Fabric & NeoForge) for ${sub.name}."
            dependsOn "${sub.path}:fabric:publishMods", "${sub.path}:neoforge:publishMods"
        }
    }
}

// -----------------------------------------------------------------------------
// Root Collection & Lifecycle Tasks
// -----------------------------------------------------------------------------

// Collects final release jars into root build/libs/<mod-name>/
tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Collects all built mod jars into root build/libs/<mod>/.'
    into rootProject.layout.buildDirectory.dir('libs')

    // Depend on build tasks of active subprojects (skipping container projects like :mod-a)
    dependsOn subprojects.findAll { it.name in ['common', 'fabric', 'neoforge'] }.collect { "${it.path}:build" }

    // Collect release jars into their respective mod folder (excluding sources & javadoc)
    subprojects.findAll { it.name in ['fabric', 'neoforge'] }.each { p ->
        def modSlug = p.parent.name
        from(p.layout.buildDirectory.dir('libs')) {
            into modSlug
            include '*.jar'
            exclude '*-sources.jar'
            exclude '*-javadoc.jar'
        }
    }
}

// Hook collection into root's standard lifecycle build task
tasks.named('build') {
    dependsOn 'collectJars'
}

// Hook recursive clean into root's standard lifecycle clean task
tasks.named('clean') {
    dependsOn subprojects.findAll { it.name in ['common', 'fabric', 'neoforge'] }.collect { "${it.path}:clean" }
}
