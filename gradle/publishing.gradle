// ==============================================================================
// Monorepo Multi-Platform Publishing Convention Script
// Powered by me.modmuss50.mod-publish-plugin (https://modmuss50.github.io/mod-publish-plugin/)
// ==============================================================================

apply plugin: 'me.modmuss50.mod-publish-plugin'

def sub = project
def modProject = sub.parent
def modSlug = modProject.name

// Resolve property helper (mod overrides first, then root defaults)
def modProp = { String key -> modProject.findProperty(key) ?: rootProject.findProperty(key) }

def mcVersion = modProp('minecraft_version')
def targetMcVersions = (modProp('publish_minecraft_versions') ?: modProp('minecraft_versions') ?: mcVersion).toString().split(',').collect { it.trim() }
def releaseTypeProp = (modProp('release_type') ?: 'release').toString().toLowerCase()
def releaseNotesFile = modProject.file('release-notes.md')

def mrToken = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
def cfToken = providers.gradleProperty('CURSEFORGE_TOKEN').orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))

def mrId = modProp('modrinth_id')
def cfId = modProp('curseforge_id')

// Environment / Side Support:
// Modrinth: CLIENT_ONLY, SERVER_ONLY, DEDICATED_SERVER_ONLY, CLIENT_AND_SERVER, SINGLEPLAYER_ONLY, etc.
// CurseForge: boolean flags (client, server)
def envProp = (modProp('environment') ?: 'both').toString().trim().toLowerCase()

def isClientOnly = envProp in ['client', 'client_only', 'singleplayer_only', 'client_only_server_optional']
def isServerOnly = envProp in ['server', 'server_only', 'dedicated_server_only', 'server_only_client_optional']

def isClient = modProp('client') != null ? modProp('client').toString().toBoolean() : (!isServerOnly)
def isServer = modProp('server') != null ? modProp('server').toString().toBoolean() : (!isClientOnly)

def mrEnv = null

switch (envProp) {
    case 'client':
    case 'client_only':
        mrEnv = 'CLIENT_ONLY'
        break
    case 'server':
    case 'server_only':
        mrEnv = 'SERVER_ONLY'
        break
    case 'dedicated_server_only':
        mrEnv = 'DEDICATED_SERVER_ONLY'
        break
    case 'both':
    case 'client_and_server':
        mrEnv = 'CLIENT_AND_SERVER'
        break
    case 'server_only_client_optional':
        mrEnv = 'SERVER_ONLY_CLIENT_OPTIONAL'
        break
    case 'client_only_server_optional':
        mrEnv = 'CLIENT_ONLY_SERVER_OPTIONAL'
        break
    case 'client_or_server_prefers_both':
        mrEnv = 'CLIENT_OR_SERVER_PREFERS_BOTH'
        break
    case 'client_or_server':
        mrEnv = 'CLIENT_OR_SERVER'
        break
    case 'singleplayer_only':
        mrEnv = 'SINGLEPLAYER_ONLY'
        break
}

publishMods {
    // Both Fabric (since 26.1 without intermediary remapping) and NeoForge produce their release jar via 'jar'
    file = tasks.named('jar').flatMap { it.archiveFile }

    // Optional dryRun mode (run with -PdryRun=true to test publishing without uploading)
    dryRun = providers.gradleProperty('dryRun').map { it.toBoolean() }.orElse(false)

    // Read changelog on-demand when publishing
    changelog = provider {
        if (!releaseNotesFile.exists() || releaseNotesFile.text.trim().isEmpty()) {
            throw new GradleException("Cannot publish '${sub.path}': Release notes file '${releaseNotesFile.absolutePath}' is missing or empty!")
        }
        return releaseNotesFile.text.trim()
    }

    // Release channel
    type = releaseTypeProp == 'alpha' ? ALPHA : (releaseTypeProp == 'beta' ? BETA : STABLE)
    modLoaders.add(sub.name)
    displayName = "${sub.ext.mod_name} ${sub.version} [${sub.name.capitalize()}]"
    version = sub.version

    // Modrinth Configuration
    if (mrId != null && !mrId.toString().trim().isEmpty()) {
        modrinth {
            projectId = mrId.toString().trim()
            accessToken = mrToken
            if (mrEnv != null) {
                environment = mrEnv
            }
            targetMcVersions.each { ver -> minecraftVersions.add(ver) }
            if (sub.name == 'fabric') {
                requires 'fabric-api'
            }
        }
    }

    // CurseForge Configuration
    if (cfId != null && !cfId.toString().trim().isEmpty()) {
        curseforge {
            projectId = cfId.toString().trim()
            accessToken = cfToken
            client = isClient
            server = isServer
            targetMcVersions.each { ver -> minecraftVersions.add(ver) }
            if (sub.name == 'fabric') {
                requires 'fabric-api'
            }
        }
    }
}

// Fail-fast validation when publishMods is explicitly triggered
tasks.named('publishMods').configure {
    doFirst {
        if (!releaseNotesFile.exists() || releaseNotesFile.text.trim().isEmpty()) {
            throw new GradleException("Cannot publish '${sub.path}': Release notes file is missing or empty!\n" +
                    "Expected path: ${releaseNotesFile.absolutePath}\n" +
                    "Please create 'release-notes.md' in 'mods/${modSlug}/' and write your changelog before publishing.")
        }

        if (!mrId && !cfId) {
            throw new GradleException("Cannot publish '${sub.path}': No platform configured. Set 'modrinth_id' and/or 'curseforge_id' in 'mods/${modSlug}/gradle.properties'.")
        }

        if (mrId && !mrToken.isPresent()) {
            throw new GradleException("Cannot publish '${sub.path}' to Modrinth: 'MODRINTH_TOKEN' is missing from ~/.gradle/gradle.properties.")
        }

        if (cfId && !cfToken.isPresent()) {
            throw new GradleException("Cannot publish '${sub.path}' to CurseForge: 'CURSEFORGE_TOKEN' is missing from ~/.gradle/gradle.properties.")
        }
    }
}
